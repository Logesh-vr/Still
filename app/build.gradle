plugins {
    id 'com.android.application'
}

android {
    namespace 'app.still.focus'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'app.still.focus'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError true
    }
}
